# Netlify settings for the Variation Cover Sheet app.
#
# The repository IS linked to Netlify, so every push rebuilds and redeploys the
# site using the command below. A folder dragged onto the drop zone is replaced
# by the next push, so hand deploys are no longer the way in.
#
# The trigger URLs and the administrator password are NOT in this repository.
# The build reads them from this site's environment variables — which is what
# makes a linked repository workable: a build can see them, a drag-and-drop
# deploy never could. Set them under Site configuration -> Environment
# variables. See docs/DEPLOY-NETLIFY.md.
#
# Why it does not just publish the repository root: everything published is at a
# public web address, and the root also holds the setup guides, the fill-in
# workbooks and the tools. None of that belongs on the open web. So the same
# script that builds the folder for a manual deploy builds what Netlify serves,
# and the two cannot drift apart.

[build]
  publish = "build/variation-coversheet"
  command = "python3 tools/make-deploy-folder.py"

# netlify/functions/flow.js calls the Power Automate flows on the browser's
# behalf, so the trigger URLs stay in this site's environment variables and are
# never sent to anyone. It reads them at runtime, so unlike the static files it
# needs no build to pick them up — which is why it works on a manual deploy too,
# as long as the netlify/functions folder goes up with the site.
#
# The variables it wants, under Site configuration -> Environment variables:
#   GET_PROJECT_URL  FILE_PDF_URL  VARIATION_LOG_READ_URL
#   VARIATION_LOG_WRITE_URL  WRITE_PROFESSIONALLY_URL
[functions]
  directory = "netlify/functions"

# SIGN-IN DOES NOT PROTECT THIS FUNCTION. The Microsoft sign-in runs in the
# browser and protects the app's pages only. /.netlify/functions/flow does not
# check the caller's Entra token, so anyone who finds its address can run the
# flows through it -- the same exposure as the trigger URLs themselves, which
# are also built into assets/flow-config.js. Before relying on the function to
# keep the flows private, make it verify an Entra access token (signature
# against the tenant's keys, issuer e52a9a87-..., audience, expiry). See
# docs/SIGN-IN.md.

# The app routes on the URL fragment (#/state/VIC), which browsers never send
# to the server, so it needs no SPA catch-all. _redirects only 404s what
# travels in the published folder but must not be served (netlify/functions).

# The security headers (Content-Security-Policy and the rest) and the
# no-cache rule for index.html are in _headers, which is copied into the
# published folder. Keeping them in one place stops the two disagreeing.
