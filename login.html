<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sign in — Axis Services Group</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --blue:#6b6e70; --bg:#f2f2f2; --border:#d4d5d6; --txt:#1a1a2e; --muted:#6b7280; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background: var(--bg);
    font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .logo { height: 46px; width: auto; margin-bottom: 22px; }
  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 6px;
  }
  p.sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  button {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #55585a; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { margin-top: 16px; font-size: 12.5px; color: #dc2626; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="axis%20services%20group.jpg" alt="Axis Services Group">
    <h1 id="appTitle"></h1>
    <p class="sub">Sign in with your Axis account to continue</p>
    <button id="signInBtn" disabled>Sign in with Microsoft</button>
    <p id="msg" role="alert"></p>
  </div>

  <script src="msal-browser.min.js"></script>
  <script src="app-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
